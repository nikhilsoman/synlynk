name: synlynk-local-pilot

services:
  omlx-relay:
    build:
      context: ..
      dockerfile: docker/local-pilot-relay.Dockerfile
    image: synlynk-local-pilot-relay:1
    command:
      - TCP-LISTEN:8000,fork,reuseaddr
      - UNIX-CONNECT:/run/synlynk/relay.sock
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    volumes:
      - type: bind
        source: ${PILOT_RELAY_SOCKET:?PILOT_RELAY_SOCKET is required}
        target: /run/synlynk/relay.sock
    networks:
      local-pilot:
        aliases: [omlx]

  aider:
    build:
      context: .
      dockerfile: local-aider.Dockerfile
      args:
        AIDER_VERSION: 0.86.2
    image: synlynk-local-aider:0.86.2
    working_dir: /workspace
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/aider:rw,noexec,nosuid,size=64m,mode=1777
      - /workspace/.synlynk:rw,noexec,nosuid,size=64m
    environment:
      HOME: /home/aider
    networks:
      - local-pilot
    volumes:
      - type: bind
        source: ${PILOT_WORKTREE:?PILOT_WORKTREE is required}
        target: /workspace

networks:
  local-pilot:
    internal: true
