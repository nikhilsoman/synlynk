name: synlynk-local-pilot

services:
  omlx-relay:
    build:
      context: ..
      dockerfile: docker/local-pilot-relay.Dockerfile
    image: synlynk-local-pilot-relay:1
    command:
      - TCP-LISTEN:8000,fork,reuseaddr
      - TCP:host.docker.internal:${PILOT_RELAY_PORT:?PILOT_RELAY_PORT is required}
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for attempt in 1 2 3 4 5; do
          wget -q -T 2 -O /dev/null http://127.0.0.1:8000/v1/models && exit 0;
          sleep 1;
          done;
          exit 1
      interval: 30s
      timeout: 12s
      retries: 10
      start_period: 2s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    networks:
      local-pilot:
        aliases: [omlx]
      host-access: {}

  aider:
    build:
      context: .
      dockerfile: local-aider.Dockerfile
      args:
        AIDER_VERSION: 0.86.2
    image: synlynk-local-aider:0.86.2
    working_dir: /workspace
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/aider:rw,noexec,nosuid,size=64m,mode=1777
      - /workspace/.synlynk:rw,noexec,nosuid,size=64m
    environment:
      HOME: /home/aider
    networks:
      - local-pilot
    volumes:
      - type: bind
        source: ${PILOT_WORKTREE:?PILOT_WORKTREE is required}
        target: /workspace

networks:
  local-pilot:
    internal: true
  host-access:
    driver: bridge
