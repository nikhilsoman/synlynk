name: synlynk-local-pilot

services:
  omlx-relay:
    build:
      context: ..
      dockerfile: docker/local-pilot-relay.Dockerfile
    image: synlynk-local-pilot-relay:1
    command:
      - TCP-LISTEN:8000,fork,reuseaddr
      - TCP:host.docker.internal:${PILOT_RELAY_PORT:?PILOT_RELAY_PORT is required}
    restart: "no"
    healthcheck:
      test: ["CMD", "socat", "-T", "2", "-u", "/dev/null", "TCP:host.docker.internal:${PILOT_RELAY_PORT}"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    networks:
      local-pilot:
        aliases: [omlx]
      host-access: {}

  aider:
    build:
      context: .
      dockerfile: local-aider.Dockerfile
      args:
        AIDER_VERSION: 0.86.2
    image: synlynk-local-aider:0.86.2
    working_dir: /workspace
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "${PILOT_UID:?}:${PILOT_GID:?}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/aider:rw,noexec,nosuid,size=64m,mode=1777
      - /workspace/.synlynk:rw,noexec,nosuid,size=64m
    environment:
      HOME: /home/aider
    networks:
      - local-pilot
    volumes:
      - type: bind
        source: ${PILOT_WORKTREE:?PILOT_WORKTREE is required}
        target: /workspace

networks:
  local-pilot:
    internal: true
  host-access:
    driver: bridge
