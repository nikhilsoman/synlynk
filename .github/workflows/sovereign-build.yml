name: Orb Stack Docker Build

on:
  push:
    tags:
      - "v0.25.*"
  pull_request:
    paths:
      - "docker/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.sovereign
          load: true
          push: false
          tags: synlynk-sovereign-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - verify synlynk installed
        run: docker run --rm synlynk-sovereign-test:latest synlynk local doctor --help

      - name: Push image (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.sovereign
          push: true
          tags: |
            ghcr.io/nikhilsoman/synlynk-sovereign:${{ github.ref_name }}
            ghcr.io/nikhilsoman/synlynk-sovereign:latest

  runner-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image
        run: docker build -f docker/Dockerfile.runner -t synlynk-runner:test .

      - name: Run stub-harness against a mounted worktree
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          docker run --rm -v "$RUNNER_TEMP/work:/work" -w /work synlynk-runner:test stub-harness
          test -f "$RUNNER_TEMP/work/stub-marker"
          set +e
          docker run --rm -e STUB_EXIT=3 synlynk-runner:test stub-harness >"$RUNNER_TEMP/stub-out"
          code=$?
          set -e
          test "$code" -eq 3
          grep -q "Input tokens: 11" "$RUNNER_TEMP/stub-out"
          grep -q "Output tokens: 7" "$RUNNER_TEMP/stub-out"
