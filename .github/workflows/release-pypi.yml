name: Publish to PyPI

# The build always runs. Upload runs only after a PyPI pending publisher
# exists for this workflow and the repository variable PYPI_PUBLISH is true.
# Without that publisher, PyPI returns invalid-publisher and the tag goes red
# (gh:#2647). The project name "synlynk" is not on PyPI yet.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for Trusted Publishing to PyPI
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package distribution
        run: |
          python -m build

      - name: Verify package distribution
        run: |
          twine check dist/*

      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Skip PyPI publish until the trusted publisher exists
        if: vars.PYPI_PUBLISH != 'true'
        run: |
          echo "PyPI trusted publisher is not enabled (gh:#2647)."
          echo "The package was built and twine check passed. It was not uploaded."
          echo "Create a pending publisher on PyPI for nikhilsoman/synlynk,"
          echo "workflow .github/workflows/release-pypi.yml, with no environment."
          echo "Then set the repository variable PYPI_PUBLISH to true."
