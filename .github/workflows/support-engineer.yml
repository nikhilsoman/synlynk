name: Support Engineer

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  support-engineer:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: pip install pytest

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Skip Support Engineer when Anthropic API key is missing
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "Skipping Support Engineer harness; ANTHROPIC_API_KEY is not configured."

      - name: Run Support Engineer harness
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python3 bin/synlynk.py harness run support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
