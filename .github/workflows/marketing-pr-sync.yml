name: Marketing PR Sync

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: marketing-pr-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  marketing-sync:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'automation/marketing-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Prepare idempotent marketing branch
        env:
          MARKETING_BRANCH: automation/marketing-sync
        run: |
          git config --global user.name "synlynk-marketing[bot]"
          git config --global user.email "marketing@synlynk.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$MARKETING_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$MARKETING_BRANCH"
            git checkout -B "$MARKETING_BRANCH" "origin/$MARKETING_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$MARKETING_BRANCH" origin/main
          fi

      - name: Synchronize PR Blog Post & Collateral
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m synlynk marketing sync-pr ${{ github.event.pull_request.number }}

      - name: Commit and publish marketing PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETING_BRANCH: automation/marketing-sync
        run: |
          git add docs/blog/
          git add -f .synlynk/social_drafts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No marketing changes to commit."
          else
            git commit -m "docs(blog): synchronize limited-treatment post for PR #${{ github.event.pull_request.number }}" \
                       -m "Co-Authored-By: Agy (Gemini) <noreply@antigravity.dev>"
            git push origin "$MARKETING_BRANCH"
          fi

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REPOSITORY_OWNER:$MARKETING_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "Reused existing marketing PR #$existing_pr."
            marketing_pr="$existing_pr"
          elif ! git diff origin/main...HEAD --quiet; then
            created_pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$MARKETING_BRANCH" \
              --title "docs(blog): synchronize marketing collateral" \
              --body "Automated post-merge marketing updates for PR #${{ github.event.pull_request.number }}.\n\nFixes #1666")
            marketing_pr="${created_pr_url##*/}"
          else
            echo "No marketing changes to publish."
          fi

          if [ -n "${marketing_pr:-}" ]; then
            gh workflow run test.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$MARKETING_BRANCH"
            echo "Dispatched required Tests checks for marketing PR #$marketing_pr."
          fi
