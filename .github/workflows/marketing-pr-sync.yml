name: Marketing PR Sync

# Per-PR blog generation is retired. This job stays so a merged pull request
# does not fail by reusing the stale automation/marketing-sync branch or
# PR #2175. Milestone blogs are a release step, not this workflow.
on:
  pull_request_target:
    types: [closed]

concurrency:
  group: marketing-pr-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  marketing-sync:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'automation/marketing-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Skip retired per-PR marketing sync
        run: |
          echo "Per-PR marketing sync is retired (gh:#2646)."
          echo "Not reusing automation/marketing-sync or an open marketing pull request."
          echo "Not dispatching Tests for that branch."
