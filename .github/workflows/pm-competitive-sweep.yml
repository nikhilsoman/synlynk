name: PM Competitive Sweep

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

jobs:
  pm-competitive-sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run PM competitive sweep
        run: python3 bin/synlynk.py pm sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push landscape updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add docs/strategy/competitive-landscape.md && git commit -m "chore(pm): update competitive landscape" && git push)
