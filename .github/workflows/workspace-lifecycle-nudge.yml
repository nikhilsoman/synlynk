name: Workspace Lifecycle Nudge

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  workspace-lifecycle-nudge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: pip install pytest

      - name: Run workspace-lifecycle-nudge agent
        # The runner has no canonical ledger. An explicit path keeps a
        # transient disk I/O error off ~/.synlynk, and the script retries
        # only that error (gh:#2649).
        run: bash .github/scripts/workspace-lifecycle-nudge.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNLYNK_STATE_DB_PATH: ${{ runner.temp }}/synlynk-nudge/state.db
