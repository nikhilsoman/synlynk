name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Guard against __init__.py regrowth
        run: |
          LINES=$(wc -l < synlynk/__init__.py)
          echo "synlynk/__init__.py is ${LINES} lines"
          if [ "$LINES" -gt 4000 ]; then
            echo "::error::synlynk/__init__.py is ${LINES} lines (limit 4000). New code belongs in a module, not __init__.py. See docs/superpowers/specs/2026-07-12-init-remodularization-design.md."
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Syntax check
        run: python -m py_compile bin/synlynk.py

      - name: Run tests
        run: pytest tests/ -v -m "not local_hardware"

      # Dry fleet matrix (no model spend). Only on one Python version — gate is
      # about repo hygiene/baselines, not interpreter variance.
      - name: Fleet matrix (dry)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e . 2>/dev/null || true
          PYTHONPATH=. python -m synlynk selftest --matrix

  # Same-workflow needs: is required — separate workflow files run in
  # parallel with no cross-file ordering, so a standalone qa-gate.yml
  # almost always saw the test matrix as pending and fail-closed.
  qa-gate:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run qa block-only merge gate
        run: python3 bin/synlynk.py pr gate-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  epubcheck:
    name: EPUBCheck 5.3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download EPUBCheck 5.3.0
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck

      - name: Validate EPUB package
        run: |
          java -jar /tmp/epubcheck/epubcheck-5.3.0/epubcheck.jar \
            docs/book/the-supervised-machine-v0.5-DRAFT.epub
