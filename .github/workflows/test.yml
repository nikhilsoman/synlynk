name: Tests

on:
  push:
    branches: [main, unstable]
    # Version-tag pushes are release cuts. They are not pull_request events,
    # so matrix-plan below keeps the full four-leg matrix.
    tags: ["v*"]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch: {}

jobs:
  # Job-level if is evaluated before the matrix exists, so matrix.* there is
  # an unrecognized named-value and the workflow fails to parse. Choose the
  # axes here instead. Pull requests schedule Linux 3.10 and Linux 3.12 —
  # branch protection requires both "test (3.10)" and "test (3.12)". The
  # macOS legs are not required. Push to main or unstable, version-tag
  # release cuts, and workflow_dispatch keep ubuntu 3.10, ubuntu 3.12,
  # macOS 3.10, and macOS 3.12. This is not a trigger paths-ignore: a
  # paths filter would skip qa-gate and release-docs and leave the required
  # checks stuck Expected (gh:#2505, gh:#2529).
  matrix-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            matrix='{"os":["ubuntu-latest"],"python-version":["3.10","3.12"]}'
          else
            matrix='{"os":["ubuntu-latest","macos-latest"],"python-version":["3.10","3.12"]}'
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix-plan
    # Keep the ubuntu legs named "test (3.x)" so the branch-protection required
    # checks keep reporting; other OS legs carry the OS in the name and are
    # informational until they are added to the required list.
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.python-version) || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    strategy:
      matrix: ${{ fromJson(needs.matrix-plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pure bookkeeping diffs skip the heavy steps below. The job itself still
      # runs so the required "test (3.10)" and "test (3.12)" checks report
      # success. Exempt paths are the closed set in synlynk/ci_paths.py
      # (project-docs/**, docs/blog/**,
      # docs/brainstorm/**, CHANGELOG.md, .gitattributes, .gitignore, roadmap.md,
      # todo.md, .synlynk/config.json). docs/superpowers/** and README.md run
      # the suite. See gh:#2505 and gh:#2529.
      - name: Detect bookkeeping-only change
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "bookkeeping_only=false" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — running full suite."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          export CHANGED
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          from synlynk.ci_paths import is_bookkeeping_only
          changed = [line for line in os.environ.get("CHANGED", "").splitlines() if line.strip()]
          flag = "true" if is_bookkeeping_only(changed) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"bookkeeping_only={flag}\n")
          print(f"bookkeeping_only={flag}")
          PY

      - name: Guard against __init__.py regrowth
        if: steps.diff.outputs.bookkeeping_only != 'true'
        run: |
          LINES=$(wc -l < synlynk/__init__.py)
          echo "synlynk/__init__.py is ${LINES} lines"
          if [ "$LINES" -gt 4000 ]; then
            echo "::error::synlynk/__init__.py is ${LINES} lines (limit 4000). New code belongs in a module, not __init__.py. See docs/superpowers/specs/2026-07-12-init-remodularization-design.md."
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.diff.outputs.bookkeeping_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest & pytest-xdist
        if: steps.diff.outputs.bookkeeping_only != 'true'
        run: pip install pytest pytest-xdist

      - name: Syntax check
        if: steps.diff.outputs.bookkeeping_only != 'true'
        run: python -m py_compile bin/synlynk.py

      - name: Run tests
        if: steps.diff.outputs.bookkeeping_only != 'true'
        run: pytest tests/ -v -m "not local_hardware and not performance and not soak" -n 4 --dist loadfile --durations=25

      # Dry fleet matrix (no model spend). Only on one Python version — gate is
      # about repo hygiene/baselines, not interpreter variance.
      - name: Fleet matrix (dry)
        if: steps.diff.outputs.bookkeeping_only != 'true' && matrix.python-version == '3.12'
        run: |
          python -m pip install -e . 2>/dev/null || true
          PYTHONPATH=. python -m synlynk selftest --matrix

      - name: Docs-only — skipped heavy steps
        if: steps.diff.outputs.bookkeeping_only == 'true'
        run: echo "Change is bookkeeping-only; skipped install/py_compile/pytest/fleet-matrix steps. See gh:#2505 and gh:#2529."

      # Timing-sensitive cold-start checks run in the dedicated performance
      # workflow so shared-runner CPU variance cannot block unrelated changes.

  test-package-e2e:
    name: test-package-e2e
    needs: matrix-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and verify CLI entrypoints in clean venv
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/clean-test-env
          /tmp/clean-test-env/bin/pip install dist/*.whl
          /tmp/clean-test-env/bin/synlynk --version
          /tmp/clean-test-env/bin/synlynk --help
          /tmp/clean-test-env/bin/synlynk doctor || true

  # Same-workflow needs: is required — separate workflow files run in
  # parallel with no cross-file ordering, so a standalone qa-gate.yml
  # almost always saw the test matrix as pending and fail-closed.
  qa-gate:
    needs: [test, test-package-e2e]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run qa block-only merge gate
        run: python3 bin/synlynk.py pr gate-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docs:
    name: release-docs
    needs: test
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest for README collection count
        run: python -m pip install pytest

      - name: Enforce named-release README and version gate
        run: python3 bin/synlynk.py release --check-docs ${{ github.event_name == 'pull_request' && '--pr-mode' || '' }}
