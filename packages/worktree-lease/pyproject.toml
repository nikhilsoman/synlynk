[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktree-lease"
version = "0.1.0"
description = "Atomic Git Worktree Concurrency & Lease Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wtlease = "worktree_lease.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worktree_lease"]
