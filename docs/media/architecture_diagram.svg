<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="650" fill="url(#bgGrad)" rx="16" />
  <rect x="1.5" y="1.5" width="1097" height="647" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15" />

  <!-- Header / Badge -->
  <rect x="40" y="40" width="120" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="100" y="58" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">SYNLYNK ENGINE</text>
  <text x="40" y="105" fill="#f8fafc" font-size="24" font-weight="700">Autonomous Growth & Marketing Engine</text>
  <text x="40" y="130" fill="#94a3b8" font-size="14">Autonomous multi-surface coordination &amp; asset generation architecture</text>

  <!-- Central Engine Node -->
  <g transform="translate(350, 180)">
    <rect width="400" height="80" rx="12" fill="url(#hubGrad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
    <text x="200" y="38" fill="#a5b4fc" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">CORE ORCHESTRATOR</text>
    <text x="200" y="60" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">MARKETING AGENT ENGINE</text>
  </g>

  <!-- Connector Lines -->
  <path d="M 550 260 L 550 320 L 145 320 L 145 370" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 550 260 L 550 320 L 415 320 L 415 370" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 550 260 L 550 320 L 685 320 L 685 370" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 550 260 L 550 320 L 955 320 L 955 370" fill="none" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 1: Website & Canvas Sync -->
  <g transform="translate(40, 380)">
    <rect width="210" height="160" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="31" cy="31" r="6" fill="#38bdf8" />
    <text x="15" y="72" fill="#f8fafc" font-size="15" font-weight="600">Website & Canvas Sync</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12" width="180">
      <tspan x="15" dy="0">Updates hero, install bar </tspan>
      <tspan x="15" dy="18">& canvas demo</tspan>
    </text>
    <line x1="15" y1="135" x2="195" y2="135" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="150" fill="#38bdf8" font-size="10" font-weight="500">SURFACE #1 ACTIVE</text>
  </g>
  <!-- Node 2: Blog Engine (Per-PR) -->
  <g transform="translate(310, 380)">
    <rect width="210" height="160" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="6" fill="#818cf8" fill-opacity="0.15" />
    <circle cx="31" cy="31" r="6" fill="#818cf8" />
    <text x="15" y="72" fill="#f8fafc" font-size="15" font-weight="600">Blog Engine (Per-PR)</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12" width="180">
      <tspan x="15" dy="0">Drafts, checks frontmatter</tspan>
      <tspan x="15" dy="18"> & indexes posts</tspan>
    </text>
    <line x1="15" y1="135" x2="195" y2="135" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="150" fill="#818cf8" font-size="10" font-weight="500">SURFACE #2 ACTIVE</text>
  </g>
  <!-- Node 3: Living Docs Auto-Gen -->
  <g transform="translate(580, 380)">
    <rect width="210" height="160" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="6" fill="#34d399" fill-opacity="0.15" />
    <circle cx="31" cy="31" r="6" fill="#34d399" />
    <text x="15" y="72" fill="#f8fafc" font-size="15" font-weight="600">Living Docs Auto-Gen</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12" width="180">
      <tspan x="15" dy="0">Regenerates reference docs</tspan>
      <tspan x="15" dy="18"> on CLI change</tspan>
    </text>
    <line x1="15" y1="135" x2="195" y2="135" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="150" fill="#34d399" font-size="10" font-weight="500">SURFACE #3 ACTIVE</text>
  </g>
  <!-- Node 4: Media & Visual Generator -->
  <g transform="translate(850, 380)">
    <rect width="210" height="160" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="6" fill="#f472b6" fill-opacity="0.15" />
    <circle cx="31" cy="31" r="6" fill="#f472b6" />
    <text x="15" y="72" fill="#f8fafc" font-size="15" font-weight="600">Media & Visual Generator</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12" width="180">
      <tspan x="15" dy="0">Builds SVG diagrams & soci</tspan>
      <tspan x="15" dy="18">al cards</tspan>
    </text>
    <line x1="15" y1="135" x2="195" y2="135" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="150" fill="#f472b6" font-size="10" font-weight="500">SURFACE #4 ACTIVE</text>
  </g>

  <!-- Footer -->
  <text x="40" y="600" fill="#475569" font-size="12">Generated by synlynk media engine • stdlib SVG vector output</text>
</svg>