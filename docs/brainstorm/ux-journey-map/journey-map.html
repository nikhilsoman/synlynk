    // State Variables
    let currentJourneyIndex = 0;
    let activeSurface = 'TUI'; // 'TUI' | 'Vizor' | 'Slack'

    // Initialize Page State
    document.addEventListener('DOMContentLoaded', () => {
      // Parse URL parameters for initial journey
      const urlParams = new URLSearchParams(window.location.search);
      const jParam = urlParams.get('journey');
      if (jParam) {
        const foundIdx = JOURNEYS.findIndex(j => j.id === jParam || j.number === jParam);
        if (foundIdx !== -1) {
          currentJourneyIndex = foundIdx;
        }
      }

      renderNavigation();
      updateJourneyDisplay();
    });

    // Render Left Sidebar Navigation List
    function renderNavigation() {
      const navContainer = document.getElementById('journey-nav-list');
      navContainer.innerHTML = JOURNEYS.map((journey, idx) => {
        const isActive = idx === currentJourneyIndex;
        return `
          <button onclick="selectJourney(${idx})" class="w-full text-left p-3.5 rounded-xl border transition-all duration-200 group ${
            isActive 
              ? 'bg-slate-900 border-cyan-500/60 shadow-lg ring-1 ring-cyan-500/20' 
              : 'bg-slate-900/40 border-slate-800/80 hover:bg-slate-900/80 hover:border-slate-700'
          }">
            <div class="flex items-center justify-between mb-1">
              <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold ${
                isActive ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'bg-slate-800 text-slate-400'
              }">JOURNEY #${journey.number}</span>
              <span class="text-[10px] text-slate-500 font-mono group-hover:text-slate-400">3 Surfaces</span>
            </div>
            <div class="text-xs font-bold ${isActive ? 'text-slate-100' : 'text-slate-300'} font-display leading-snug">
              ${journey.shortTitle}
            </div>
          </button>
        `;
      }).join('');
    }

    // Select a Journey by Index
    function selectJourney(index) {
      if (index === currentJourneyIndex) return;
      currentJourneyIndex = index;
      renderNavigation();
      updateJourneyDisplay();
    }

    // Select a Surface ('TUI' | 'Vizor' | 'Slack')
    function selectSurface(surface) {
      if (surface === activeSurface) return;
      activeSurface = surface;
      updateJourneyDisplay();
    }

    // Update Display and Trigger CSS Animated Transition
    function updateJourneyDisplay() {
      const journey = JOURNEYS[currentJourneyIndex];

      // Update Title & Metadata Card
      document.getElementById('journey-badge').innerText = `JOURNEY #${journey.number}`;
      document.getElementById('journey-title').innerText = journey.title;
      document.getElementById('journey-description').innerText = journey.description;

      // Update Surface Toggle Buttons Styling
      const surfaces = ['TUI', 'Vizor', 'Slack'];
      surfaces.forEach(s => {
        const btn = document.getElementById(`btn-surface-${s.toLowerCase()}`);
        if (s === activeSurface) {
          btn.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-teal-500 text-white shadow-lg shadow-cyan-500/20";
        } else {
          btn.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
        }
      });

      // Get Content Render string for Active Surface
      const stepObj = journey.steps.find(step => step.surface === activeSurface) || journey.steps[0];
      const viewport = document.getElementById('surface-viewport');

      // Trigger CSS animation: fade-out -> update HTML -> fade-in
      viewport.classList.add('switching');
      setTimeout(() => {
        viewport.innerHTML = stepObj.render;
        viewport.classList.remove('switching');
      }, 150);
    }
  </script>
